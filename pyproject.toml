[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fily"
version = "0.1.0"
description = "An explainable, approval-first agentic filing system"
requires-python = ">=3.9"

[project.optional-dependencies]
desktop = ["pyinstaller>=6.0,<7"]

[project.scripts]
fily = "fily.cli:main"

[tool.setuptools.packages.find]
include = ["fily*"]
