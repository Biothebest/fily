[package]
name = "fily-desktop"
version = "0.1.0"
description = "Private, approval-first email and file workspace"
authors = ["Fily"]
license = "Proprietary"
repository = "https://github.com/Biothebest/fily"
homepage = "https://github.com/Biothebest/fily"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fily_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
async-trait = "0.1"
imap = { version = "2.4", default-features = false, features = ["tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "native-tls", "smtp-transport"] }
mailparse = "0.15"
native-tls = "0.2"
ammonia = "4"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
open = "5.3"
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSSecureTextField", "NSTextField", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
